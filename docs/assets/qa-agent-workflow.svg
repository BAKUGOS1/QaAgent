<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">QA Agent workflow</title>
  <desc id="desc">Premium workflow diagram showing how QaAgent turns a task into browser execution, QA evidence, coverage truth, and reports.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF6F7"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#071923"/>
      <stop offset="52%" stop-color="#0F3A44"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M3,3 L13,8 L3,13 Z" fill="#64748B"/>
    </marker>
    <style>
      .title { font: 800 44px Inter, Segoe UI, Arial, sans-serif; fill: #FFFFFF; letter-spacing: 0; }
      .subtitle { font: 400 18px Inter, Segoe UI, Arial, sans-serif; fill: #D7FFFA; letter-spacing: 0; }
      .eyebrow { font: 800 12px Inter, Segoe UI, Arial, sans-serif; fill: #0F766E; letter-spacing: 1.1px; }
      .card { fill: #FFFFFF; stroke: #D8E4EA; stroke-width: 1.5; rx: 18; }
      .cardTitle { font: 800 21px Inter, Segoe UI, Arial, sans-serif; fill: #0F172A; letter-spacing: 0; }
      .cardText { font: 400 15px Inter, Segoe UI, Arial, sans-serif; fill: #475569; letter-spacing: 0; }
      .small { font: 700 12px Inter, Segoe UI, Arial, sans-serif; fill: #0F766E; letter-spacing: 0; }
      .lane { font: 800 13px Inter, Segoe UI, Arial, sans-serif; fill: #334155; letter-spacing: 1px; }
      .arrow { stroke: #64748B; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #CBD5E1; stroke-width: 1.4; fill: none; }
      .chip { fill: #ECFDF5; stroke: #A7F3D0; stroke-width: 1; rx: 999; }
      .chipText { font: 700 12px Inter, Segoe UI, Arial, sans-serif; fill: #047857; letter-spacing: 0; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#page)"/>
  <rect x="48" y="40" width="1344" height="150" rx="28" fill="url(#hero)"/>
  <text class="title" x="92" y="100">How QA Agent Works</text>
  <text class="subtitle" x="94" y="136">Local Playwright execution with safe automation, smart login, evidence capture, coverage truth, and Excel-first reports.</text>
  <rect x="1140" y="80" width="192" height="46" rx="23" fill="#FFFFFF" opacity="0.14"/>
  <text x="1172" y="109" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">TypeScript + Playwright</text>

  <text class="lane" x="78" y="238">INPUT</text>
  <text class="lane" x="360" y="238">MODE</text>
  <text class="lane" x="650" y="238">LOCAL EXECUTION</text>
  <text class="lane" x="990" y="238">QA INTELLIGENCE</text>
  <text class="lane" x="1260" y="238">OUTPUT</text>

  <rect class="card" x="70" y="270" width="230" height="170"/>
  <circle cx="112" cy="314" r="22" fill="#E0F2FE"/>
  <path d="M104 314h16M112 306v16" stroke="#0369A1" stroke-width="3" stroke-linecap="round"/>
  <text class="cardTitle" x="92" y="365">Task or JSON</text>
  <text class="cardText" x="92" y="395">URL, scope, modules,</text>
  <text class="cardText" x="92" y="419">login config, report</text>
  <text class="cardText" x="92" y="443">format, and safety.</text>

  <rect class="card" x="350" y="270" width="230" height="170"/>
  <circle cx="392" cy="314" r="22" fill="#F0FDFA"/>
  <path d="M383 314h18l7-8M401 314l7 8" stroke="#0F766E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="cardTitle" x="372" y="365">Reasoning Mode</text>
  <text class="cardText" x="372" y="395">Codex/no-API, Groq</text>
  <text class="cardText" x="372" y="419">tool loop, or state-only</text>
  <text class="cardText" x="372" y="443">inspection.</text>

  <rect class="card" x="630" y="250" width="265" height="130"/>
  <text class="eyebrow" x="658" y="290">STEP 01</text>
  <text class="cardTitle" x="658" y="322">Smart Login</text>
  <text class="cardText" x="658" y="352">Uses env-backed credentials</text>
  <text class="cardText" x="658" y="376">and verifies success signals.</text>

  <rect class="card" x="630" y="420" width="265" height="150"/>
  <text class="eyebrow" x="658" y="460">STEP 02</text>
  <text class="cardTitle" x="658" y="492">Safe Browser Work</text>
  <text class="cardText" x="658" y="522">Opens pages, clicks safely,</text>
  <text class="cardText" x="658" y="546">captures screenshots, state,</text>
  <text class="cardText" x="658" y="570">console, network, and trace.</text>

  <rect class="card" x="970" y="270" width="250" height="170"/>
  <circle cx="1012" cy="314" r="22" fill="#EEF2FF"/>
  <path d="M1003 322l8-18 8 18M1007 316h10" stroke="#4338CA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="cardTitle" x="992" y="365">Detectors</text>
  <text class="cardText" x="992" y="395">Forms, tables, links,</text>
  <text class="cardText" x="992" y="419">toasts, validations, UX,</text>
  <text class="cardText" x="992" y="443">console, and network.</text>

  <rect class="card" x="970" y="480" width="250" height="170"/>
  <circle cx="1012" cy="524" r="22" fill="#ECFDF5"/>
  <path d="M1002 524l7 7 15-17" stroke="#047857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="cardTitle" x="992" y="575">Coverage Truth</text>
  <text class="cardText" x="992" y="605">Pass, Partial, Blocked,</text>
  <text class="cardText" x="992" y="629">Needs Verification,</text>
  <text class="cardText" x="992" y="653">or Not Tested.</text>

  <rect class="card" x="1270" y="270" width="120" height="170"/>
  <text class="cardTitle" x="1292" y="324">Report</text>
  <text class="cardText" x="1292" y="358">Excel</text>
  <text class="cardText" x="1292" y="382">Markdown</text>
  <text class="cardText" x="1292" y="406">JSON</text>

  <rect class="card" x="1270" y="480" width="120" height="170"/>
  <text class="cardTitle" x="1292" y="534">Artifacts</text>
  <text class="cardText" x="1292" y="568">Screens</text>
  <text class="cardText" x="1292" y="592">State</text>
  <text class="cardText" x="1292" y="616">Trace</text>

  <path class="arrow" d="M300 355H350"/>
  <path class="arrow" d="M580 355C606 355 606 315 630 315"/>
  <path class="arrow" d="M763 380V420"/>
  <path class="arrow" d="M895 495C926 495 928 355 970 355"/>
  <path class="arrow" d="M1095 440V480"/>
  <path class="arrow" d="M1220 355H1270"/>
  <path class="arrow" d="M1220 565H1270"/>

  <rect x="90" y="716" width="1260" height="100" rx="22" fill="#FFFFFF" stroke="#D8E4EA" stroke-width="1.5"/>
  <rect x="118" y="742" width="112" height="34" class="chip"/>
  <text class="chipText" x="142" y="764">DEFAULT</text>
  <text x="250" y="762" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" fill="#0F172A">No fake clean pass.</text>
  <text x="250" y="792" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#475569">The report separates tested, partial, blocked, and not-tested areas, while reports and artifacts stay local and ignored by Git.</text>
</svg>
